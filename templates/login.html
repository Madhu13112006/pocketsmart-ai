<!DOCTYPE html>
<html lang="en">
<head>
  <title>Sign In — PocketSmart AI</title>
  {% include "_head.html" %}
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-brand"><i class="fa-solid fa-wallet"></i> PocketSmart</div>
      <div class="auth-tagline">AI-Powered Budget Planning</div>
      <h2>Welcome Back</h2>

      <div class="error-banner" id="errorBanner"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-icon-wrap">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="username" name="username" required>
          </div>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-icon-wrap">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" name="password" required>
          </div>
          <div style="text-align:right;margin-top:0.4rem;">
            <a href="#" style="font-size:0.85rem;color:var(--navy-light);">Forgot Password?</a>
          </div>
        </div>
        <button type="submit" class="btn btn-primary auth-submit">Sign In <i class="fa-solid fa-arrow-right"></i></button>
      </form>

      <div class="auth-footer-link">Don't have an account? <a href="/register" style="color:var(--navy-light);font-weight:600;">Create Account</a></div>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorBanner = document.getElementById("errorBanner");
      hideBanner(errorBanner);

      const formData = new URLSearchParams();
      formData.append("username", document.getElementById("username").value);
      formData.append("password", document.getElementById("password").value);

      try {
        const response = await fetch("/token", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: formData,
          credentials: "include",
        });
        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          throw new Error(data.detail || "Invalid username or password.");
        }
        window.location.href = "/dashboard";
      } catch (err) {
        showBanner(errorBanner, err.message);
      }
    });
  </script>
</body>
</html>
